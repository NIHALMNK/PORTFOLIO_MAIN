<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 400" fill="none">
  <!-- Left vertical line of M / N -->
  <line x1="80" y1="80" x2="80" y2="320" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Diagonal down of M / N -->
  <line x1="80" y1="80" x2="210" y2="320" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Diagonal up of M -->
  <line x1="210" y1="320" x2="340" y2="80" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right vertical line of M / N / K spine -->
  <line x1="340" y1="80" x2="340" y2="320" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- K upper arm -->
  <line x1="340" y1="200" x2="405" y2="80" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- K lower arm -->
  <line x1="340" y1="200" x2="405" y2="320" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
